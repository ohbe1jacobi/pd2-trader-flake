name: Promote tested packaging release

on:
  workflow_run:
    workflows: [Build and test]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pd2-release-state
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.repository == 'ohbe1jacobi/pd2-trader-flake' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: write
    steps:
      - name: Check out trusted default-branch controller, never the built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify exact CI attempt and PR provenance, then promote or publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-lifecycle.mjs

  diagnose:
    if: >-
      github.repository == 'ohbe1jacobi/pd2-trader-flake' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Leave idempotent diagnostic without closing failed PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-lifecycle.mjs --diagnose
